name: Run on PR Creation

on:
  workflow_dispatch:

  workflow_call:
      
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  Build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Execute Upwind CI scan plugin
        uses: upwindsecurity/shiftleft-create-image-scan-event-action@AG-0_test_env_vars
        with:
          upwind_client_id: ${{ secrets.INTEGRATION_UPWIND_CI_EVENT_DEV_CLIENT_ID }}
          upwind_client_secret: ${{ secrets.INTEGRATION_UPWIND_CI_EVENT_DEV_CLIENT_SECRET }}
          upwind_uri: upwind.io
          docker_image: ubuntu:18.04
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pr_number: ${{ github.event.number }}
          add_comment: true
          debug: true
